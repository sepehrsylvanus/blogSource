name: editorial-blog-dev
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog_dev_password
      POSTGRES_DB: blog
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata_dev:
